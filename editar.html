<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Gerenciar perfis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="assets/netflix-logo.svg" alt="Netflix" class="logo">
  </header>

  <main class="profiles-page">
    <h1>Gerenciar perfis</h1>

    <div class="profiles-grid">
      <a href="#" class="profile edit-mode">
        <div class="avatar-wrap">
          <img src="assets/perfil1.png" alt="Perfil Pedro">
          <span class="edit-icon">&#9998;</span>
        </div>
        <span>Pedro</span>
      </a>

      <a href="#" class="profile edit-mode">
        <div class="avatar-wrap">
          <img src="assets/perfil2.png" alt="Perfil Nathália">
          <span class="edit-icon">&#9998;</span>
        </div>
        <span>Nathália</span>
      </a>

      <a href="#" class="profile edit-mode">
        <div class="avatar-wrap">
          <img src="assets/perfil3.png" alt="Perfil Kids">
          <span class="edit-icon">&#9998;</span>
        </div>
        <span>Kids</span>
      </a>

      <a href="#" class="profile edit-mode">
        <div class="avatar-wrap">
          <img src="assets/perfil4.png" alt="Perfil Família">
          <span class="edit-icon">&#9998;</span>
        </div>
        <span>Família</span>
      </a>

      <a href="#" class="profile add-profile">
        <div class="avatar-wrap add-icon">+</div>
        <span>Adicionar perfil</span>
      </a>
    </div>

    <a href="index.html" class="manage-profiles-btn">Concluído</a>
  </main>

  <footer>
    <p>Projeto acadêmico sem fins comerciais &mdash; inspirado na tela de perfis da Netflix.</p>
  </footer>

</body>
</html>
